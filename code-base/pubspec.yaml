name: cheque_management
description: Cheque Management - Multi-Bank Cheque & Ledger Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  crypto: ^3.0.3
  pdf: ^3.10.7
  printing: ^5.12.0
  shimmer: ^3.0.0
  http: ^1.2.1
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/banks/
    - assets/logos/